{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-5 mt-4">
    <h2 class="fw-bold text-white">Donor Management</h2>
    <a href="{{ url_for('admin_dashboard') }}" class="btn btn-outline-glossy border-0">&larr; Back to Dashboard</a>
</div>

<div class="glossy-card p-4">
    <div class="table-responsive">
        <table class="table table-dark table-borderless table-hover mb-0">
            <thead style="border-bottom: 1px solid rgba(255,255,255,0.1);">
                <tr>
                    <th class="text-muted fw-medium">ID</th>
                    <th class="text-muted fw-medium">Username</th>
                    <th class="text-muted fw-medium">Email</th>
                    <th class="text-muted fw-medium">Registered</th>
                    <th class="text-muted fw-medium">Donations</th>
                </tr>
            </thead>
            <tbody>
                {% for u in users %}
                <tr>
                    <td class="text-muted">{{ u.id }}</td>
                    <td class="text-white">{{ u.username }}</td>
                    <td>{{ u.email }}</td>
                    <td>{{ u.created_at.strftime('%Y-%m-%d') }}</td>
                    <td class="fw-bold" style="color: var(--accent-blue);">{{ u.donations|length }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
