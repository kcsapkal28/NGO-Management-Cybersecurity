[pytest]
# Single source of truth for the monitoring test module.
# Without testpaths/norecursedirs, pytest collects routes/system_test.py
# (matches *_test.py) and tries to import it outside Flask app context.
testpaths = tests/monitoring
python_files = test_*.py
norecursedirs = venv routes monitoring k8s static templates System-Reports .git
markers =
    smoke: fast post-deploy sanity checks (~30s total)
    full: full validation suite, may take several minutes
    correlation: end-to-end metric/log/trace correlation tests
    alerts: requires Alertmanager to be deployed
addopts = -ra --tb=short --strict-markers
log_cli = true
log_cli_level = INFO
