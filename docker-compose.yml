version: "3.9"
services:
  web:
    build: .
    ports:
      - "5001:5001"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/ngo_db
      - JAEGER_HOST=jaeger
      - JAEGER_SERVICE_NAME=ngo-management-app # <--- FIXED: Matches Grafana dashboard query
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_started
      fluentd:
        condition: service_healthy # <--- FIXED: Wait for Fluentd to actually be ready
    logging:
      driver: "fluentd"
      options:
        fluentd-address: "localhost:24224" # <--- FIXED: More reliable than 127.0.0.1 for Docker daemon
        fluentd-async: "true"
        tag: "flask.web"

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=ngo_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.10.2
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
    ports:
      - "9200:9200"
    healthcheck: # <--- ADDED: To ensure ES is ready for Fluentd and Jaeger
      test: ["CMD-SHELL", "curl -s http://localhost:9200 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  fluentd:
    build: ./monitoring/fluentd
    user: root
    command: fluentd -c /fluentd/etc/fluent.conf -p /fluentd/plugins
    volumes:
      - ./monitoring/fluentd/fluent.conf:/fluentd/etc/fluent.conf
    ports:
      - "24224:24224"
      - "24224:24224/udp"
    depends_on:
      elasticsearch:
        condition: service_healthy # <--- FIXED: Don't start Fluentd until ES is ready
    healthcheck: # <--- ADDED: To ensure Fluentd is listening before web starts
      test: ["CMD-SHELL", "netstat -an | grep 24224 > /dev/null; if [ 0 != $$? ]; then exit 1; fi;"]
      interval: 5s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus
    volumes:
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards

  jaeger:
    image: jaegertracing/all-in-one:latest
    environment:
      - COLLECTOR_ZIPKIN_HOST_PORT=:9411
      - SPAN_STORAGE_TYPE=elasticsearch          # <--- FIXED: Tell Jaeger to use Elasticsearch
      - ES_SERVER_URLS=http://elasticsearch:9200 # <--- FIXED: Point Jaeger to ES container
    depends_on:
      elasticsearch:
        condition: service_healthy
    ports:
      - "16686:16686"
      - "9411:9411"
      - "6831:6831/udp"
      - "6832:6832/udp"
      - "5778:5778"
      - "14268:14268"
      - "14250:14250"
      - "4317:4317"
      - "4318:4318"

volumes:
  postgres_data: