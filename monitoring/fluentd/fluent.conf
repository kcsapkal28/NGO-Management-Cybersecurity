<source>
  @type forward
  port 24224
  bind 0.0.0.0
</source>

<match **>
  @type elasticsearch
  host elasticsearch
  port 9200
  logstash_format true
  logstash_prefix fluentd
  logstash_dateformat %Y.%m.%d  # <--- FIXED: Added dots to match Grafana datasources.yml
  include_tag_key true
  tag_key @log_name
  <buffer>
    flush_interval 1s
  </buffer>
</match>