apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - base/secrets.yaml
  - base/configmaps.yaml
  - app/db.yaml
  - app/web.yaml
  - monitoring/elasticsearch.yaml
  - monitoring/elasticsearch-init.yaml
  - monitoring/fluentd.yaml
  - monitoring/jaeger.yaml
  - monitoring/prometheus.yaml
  - monitoring/grafana.yaml

configMapGenerator:
  - name: grafana-datasources
    files:
      - base/grafana-provisioning/datasources/datasources.yml
  - name: grafana-dashboards
    files:
      - base/grafana-provisioning/dashboards/dashboards.yml
      - base/grafana-provisioning/dashboards/app-overview.json
      - base/grafana-provisioning/dashboards/infrastructure.json
      - base/grafana-provisioning/dashboards/logs-traces.json
