apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-rules
data:
  app.rules.yml: |
    groups:
      - name: ngo-app
        interval: 30s
        rules:
          - alert: HighErrorRate
            expr: |
              sum(rate(flask_http_request_total{status=~"5.."}[5m]))
                / clamp_min(sum(rate(flask_http_request_total[5m])), 1) > 0.05
            for: 10m
            labels:
              severity: warning
              service: flask_app
            annotations:
              summary: "Flask 5xx ratio is {{ $value | humanizePercentage }} over 5m"
              description: "More than 5% of requests are failing for the last 10 minutes. Check {{ $labels.pod }} logs and recent deploys."

          - alert: HighLatencyP95
            expr: |
              histogram_quantile(0.95, sum(rate(flask_http_request_duration_seconds_bucket[5m])) by (le)) > 1
            for: 10m
            labels:
              severity: warning
              service: flask_app
            annotations:
              summary: "P95 request latency above 1s"
              description: "P95 latency = {{ $value }}s — investigate slow routes via Jaeger."

          - alert: WebAppDown
            expr: up{job="flask_app"} == 0
            for: 2m
            labels:
              severity: critical
              service: flask_app
            annotations:
              summary: "Flask app unreachable on Prometheus scrape"

      - name: infra
        interval: 30s
        rules:
          - alert: PodCrashLooping
            expr: increase(kube_pod_container_status_restarts_total[15m]) > 3
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} restarted >3 times in 15m"

          - alert: PodNotReady
            expr: kube_pod_status_ready{condition="true"} == 0
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} not Ready for 10m"

      - name: storage
        interval: 30s
        rules:
          - alert: ESClusterUnhealthy
            expr: elasticsearch_cluster_health_status{color="red"} == 1
            for: 5m
            labels:
              severity: critical
              service: elasticsearch
            annotations:
              summary: "Elasticsearch cluster status is RED"

          - alert: PostgresDown
            expr: pg_up == 0
            for: 2m
            labels:
              severity: critical
              service: postgres
            annotations:
              summary: "postgres-exporter cannot reach the database"

          - alert: ESDiskPressure
            expr: |
              1 - (elasticsearch_filesystem_data_available_bytes
                   / elasticsearch_filesystem_data_size_bytes) > 0.85
            for: 10m
            labels:
              severity: warning
              service: elasticsearch
            annotations:
              summary: "ES filesystem >85% full ({{ $value | humanizePercentage }})"
