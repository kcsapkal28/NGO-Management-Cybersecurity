apiVersion: v1
kind: Service
metadata:
  name: fluentd-service
spec:
  ports:
    - port: 24224
      targetPort: 24224
  selector:
    app: fluentd
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fluentd
spec:
  selector:
    matchLabels:
      app: fluentd
  template:
    metadata:
      labels:
        app: fluentd
    spec:
      containers:
        - name: fluentd
          image: ngo-fluentd:latest
          imagePullPolicy: Never
          securityContext:
            runAsUser: 0
          env:
            - name: FLUENTD_CONF
              value: "fluent.conf"
          volumeMounts:
            - name: config-volume
              mountPath: /fluentd/etc/fluent.conf
              subPath: fluent.conf
            - name: varlog
              mountPath: /var/log
      volumes:
        - name: config-volume
          configMap:
            name: fluentd-config
        - name: varlog
          hostPath:
            path: /var/log
